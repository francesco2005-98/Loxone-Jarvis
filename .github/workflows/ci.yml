name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jarvis/requirements*.txt
      - name: Install
        run: pip install -r jarvis/requirements-dev.txt
      - name: Tests
        working-directory: jarvis
        run: python -m pytest -q
      - name: Interface scripts parse
        run: |
          mkdir -p /tmp/js
          for f in $(find jarvis/jarvis/static/js -name '*.js'); do
            cp "$f" "/tmp/js/$(echo "$f" | tr '/' '_').mjs"
          done
          for f in /tmp/js/*.mjs; do node --check "$f"; done
      - name: Piper server parses
        run: python -m py_compile piper/server.py

  images:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - name: Build jarvis image
        run: docker build -t loxone-jarvis/jarvis:ci jarvis
      - name: Build piper image
        run: docker build -t loxone-jarvis/piper:ci piper
      - name: Smoke test
        run: |
          docker network create jarvis-ci
          docker run -d --name piper --network jarvis-ci loxone-jarvis/piper:ci
          docker run -d --name jarvis --network jarvis-ci -p 8500:8500 \
            -e JARVIS_SECRET_KEY=ci-only-secret-key-0123456789abcdef \
            -e JARVIS_PIPER_URL=http://piper:5000 \
            -e JARVIS_TRUSTED_NETWORKS=0.0.0.0/0 \
            --read-only --tmpfs /tmp -v jarvis-ci-data:/data loxone-jarvis/jarvis:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8500/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8500/api/session
          curl -fsS http://127.0.0.1:8500/ | grep -q "JARVIS"
          for i in $(seq 1 60); do
            if docker exec jarvis python -c "import urllib.request,json; v=json.load(urllib.request.urlopen('http://piper:5000/voices')); assert len(v) >= 2; print([x['id'] for x in v])"; then break; fi
            sleep 3
          done
          docker exec jarvis python -c "import urllib.request,json; r=urllib.request.Request('http://piper:5000/synthesize', data=json.dumps({'text':'Guten Abend.','voice':'de_DE-thorsten-high'}).encode(), headers={'Content-Type':'application/json'}); d=urllib.request.urlopen(r).read(); assert d[:4]==b'RIFF'; print(len(d), 'bytes')"
          docker exec jarvis python -c "from jarvis.voice.stt import Recognizer; from pathlib import Path; r=Recognizer(Path('/models')); r.preload('small'); import numpy as np; t=r.transcribe(np.zeros(16000, dtype='<i2').tobytes(), model='small', language='de'); print('stt ok', t)"
          docker exec jarvis python -c "from jarvis.voice.speaker import SpeakerRecognizer; from pathlib import Path; import numpy as np; s=SpeakerRecognizer(Path('/models/speaker/wespeaker_en_voxceleb_resnet34_LM.onnx')); e=s.embed((np.random.randn(32000)*3000).astype('<i2').tobytes()); print('speaker dim', e.shape)"
          docker logs jarvis 2>&1 | tail -n 30
