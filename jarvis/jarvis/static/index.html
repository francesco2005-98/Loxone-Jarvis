<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Jarvis · Loxone Intelligence</title>
  <link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <section class="gate hidden" id="gate" aria-label="Anmeldung">
    <div class="top">LOXONE &nbsp;×&nbsp; JARVIS</div>
    <div class="core-text"><div class="w">JARVIS</div><div class="s">HOME INTELLIGENCE</div></div>
    <div class="bottom">
      <h2 id="gate-title">Dein Zuhause denkt mit.</h2>
      <div class="tag" id="gate-tag">DEINE KI. DEINE STIMME. DEINE KONTROLLE.</div>
      <form id="gate-form" autocomplete="on">
        <input class="input" id="gate-password" type="password" autocomplete="current-password" placeholder="Passwort" required minlength="10">
        <input class="input hidden-field" id="gate-password2" type="password" autocomplete="new-password" placeholder="Passwort wiederholen" minlength="10">
        <button class="btn primary" type="submit" id="gate-submit">Anmelden</button>
        <div class="error-text" id="gate-error" role="alert"></div>
      </form>
    </div>
    <div class="corner l">INTERFACE / HAUSNETZ</div>
    <div class="corner r" id="gate-version">JARVIS OS</div>
  </section>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 34 38" aria-hidden="true">
          <path d="M17 1.5 32 10v18L17 36.5 2 28V10z" fill="none" stroke="#f2c21b" stroke-width="1.6"/>
          <path d="M19.5 11v12.2c0 3-1.9 4.8-4.7 4.8-1.6 0-2.9-.6-3.8-1.6" fill="none" stroke="#f2c21b" stroke-width="2"/>
        </svg>
        <div>
          <div class="word">JARVIS</div>
          <div class="sub">Loxone Intelligence</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Seiten">
        <button data-page="overview">Übersicht</button>
        <button data-page="ai">KI</button>
        <button data-page="mics">Mikrofone</button>
        <button data-page="loxone">Loxone</button>
        <span class="underline" id="nav-underline"></span>
      </nav>
      <div class="top-right">
        <span class="pill live" id="system-pill"><span class="dot"></span><span id="system-text">System online</span></span>
        <span class="user">Admin &nbsp;/&nbsp; <button id="logout" type="button">Abmelden</button></span>
      </div>
    </header>
    <main><div class="view" id="view"></div></main>
    <footer>
      <div id="foot-left">JARVIS OS</div>
      <div class="center" id="foot-center">01 / NEURAL COMMAND CENTER</div>
      <div class="right" id="foot-clock"></div>
      <div class="progress" id="foot-progress"></div>
    </footer>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
