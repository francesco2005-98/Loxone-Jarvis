# One Coolify application: "Docker Compose" build pack, this repository.
# In Coolify set the domain of the service "jarvis" to https://<name>:8000 and the
# environment variable JARVIS_SECRET_KEY as a secret. Everything else is set in the web interface.

services:
  jarvis:
    build:
      context: ./jarvis
    restart: unless-stopped
    environment:
      JARVIS_SECRET_KEY: ${JARVIS_SECRET_KEY}
      JARVIS_INITIAL_PASSWORD: ${JARVIS_INITIAL_PASSWORD:-}
      JARVIS_TRUSTED_NETWORKS: ${JARVIS_TRUSTED_NETWORKS:-}
      JARVIS_PIPER_URL: http://piper:5000
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - jarvis-data:/data
    expose:
      - "8000"
    ports:
      # Only the microphones use this port: address hello and firmware updates.
      - "${JARVIS_DEVICE_PORT:-8765}:8765"
    depends_on:
      piper:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  piper:
    build:
      context: ./piper
    restart: unless-stopped
    expose:
      - "5000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  jarvis-data:
