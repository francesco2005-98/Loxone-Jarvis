# One Coolify application: "Docker Compose" build pack, this repository.
# Without a domain the web interface is http://<server>:8500. The Live page
# with the tablet microphone runs on https://<server>:8501 with a self-signed
# certificate (confirm it once in the browser). Set JARVIS_SECRET_KEY as a
# secret. Everything else is set in the web interface.

services:
  jarvis:
    build:
      context: ./jarvis
    restart: unless-stopped
    environment:
      JARVIS_SECRET_KEY: ${JARVIS_SECRET_KEY}
      JARVIS_INITIAL_PASSWORD: ${JARVIS_INITIAL_PASSWORD:-}
      JARVIS_TRUSTED_NETWORKS: ${JARVIS_TRUSTED_NETWORKS:-}
      JARVIS_PIPER_URL: http://piper:5000
      JARVIS_HTTP_PORT: ${JARVIS_HTTP_PORT:-8500}
      JARVIS_HTTPS_PORT: ${JARVIS_HTTPS_PORT:-8501}
      # Session cookie over plain HTTP, so http://<server>:8500 can log in.
      JARVIS_INSECURE_COOKIES: ${JARVIS_INSECURE_COOKIES:-1}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - jarvis-data:/data
    ports:
      # Web interface, reachable on the host without a domain.
      - "${JARVIS_HTTP_PORT:-8500}:${JARVIS_HTTP_PORT:-8500}"
      # Same interface over HTTPS, needed for the microphone on the Live page.
      - "${JARVIS_HTTPS_PORT:-8501}:${JARVIS_HTTPS_PORT:-8501}"
      # Microphones: address hello and firmware updates.
      - "${JARVIS_DEVICE_PORT:-8765}:8765"
    depends_on:
      piper:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  piper:
    build:
      context: ./piper
    restart: unless-stopped
    expose:
      - "5000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  jarvis-data:
